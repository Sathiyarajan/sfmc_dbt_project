name: 'sfmc_email_analytics'
version: '1.0.0'
config-version: 2

profile: 'sfmc_email_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # controls how far back staging pulls from the S3-backed external stage / raw tables
  staging_start_date: '2020-01-01'

models:
  sfmc_email_analytics:
    # ---------------- BRONZE (staging) ----------------
    staging:
      +schema: bronze
      +materialized: view
      sfmc:
        +tags: ['bronze', 'staging']

    # ---------------- SILVER (enrichment / cleaning) ----------------
    intermediate:
      +schema: silver
      +materialized: transient_table   # custom materialization -> transient table, see macros/materializations
      sfmc:
        +tags: ['silver', 'enrichment']

    # ---------------- GOLD (marts / reporting) ----------------
    marts:
      +schema: gold
      +materialized: table
      email_analytics:
        +tags: ['gold', 'marts']
        account_summary:
          +materialized: incremental
          +incremental_strategy: merge
        journey_summary:
          +materialized: incremental
          +incremental_strategy: merge
      tableau:
      +schema: gold
      +materialized: table
      email_analytics:
        +tags: ['gold', 'marts']
        account_summary:
          +materialized: incremental
          +incremental_strategy: merge
        journey_summary:
          +materialized: incremental
          +incremental_strategy: merge

snapshots:
  sfmc_email_analytics:
    +target_schema: silver_snapshots
    +strategy: timestamp
    +updated_at: modified_date
    +transient: false     # snapshots must NOT be transient (need Time Travel / Fail-safe for audit history)

seeds:
  sfmc_email_analytics:
    +schema: seed_data
    +quote_columns: false
